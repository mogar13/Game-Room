<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Game Shack</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  
  <link rel="icon" type="image/png" href="system/images/icons/joystick.png">
  <link rel="apple-touch-icon" href="system/images/icons/joystick.png">
  <link rel="manifest" href="manifest.json">
  
  <link rel="stylesheet" href="hub-style.css">
</head>
<body>

  <div class="profile-banner">
    <div class="profile-left">
      <div class="player-info-row">
        <span class="profile-icon">👤</span> 
        <span id="display-player-name">Player</span>
        <span id="display-player-level" class="level-badge">Lv.1</span>
      </div>
      <div class="xp-bar-container">
        <div id="xp-bar-fill" class="xp-bar-fill"></div>
        <span id="xp-text" class="xp-text">0 / 500 XP</span>
      </div>
      <div id="display-player-title" class="player-title">Newcomer</div>
    </div>
    <div class="profile-right" style="display: flex; align-items: center; gap: 10px;">
      <div class="money-display">
        <span class="profile-icon">💰</span> 
        $<span id="display-player-money">5000</span>
      </div>
      <button id="daily-bonus-btn" class="hub-interactive">Claim +$1,000</button>
      <button id="btn-achievements" class="hub-interactive" style="background: #3498db; border: none; border-radius: 8px; font-size: 1.2rem; cursor: pointer; padding: 2px 8px; box-shadow: 0 0 10px rgba(52, 152, 219, 0.4);" title="Trophy Room">🏆</button>
      <select id="theme-dropdown" class="hub-interactive" onchange="changeTheme(this.value)">
        <option value="default">Night Mode</option>
        <option value="casino">Casino Felt</option>
        <option value="arcade">Deep Arcade</option>
      </select>
    </div>
  </div>

  <div id="favorites-bar" class="favorites-bar hidden"></div>

  <div id="recently-played-bar" class="hidden">
    <span class="rp-label">RECENTLY PLAYED</span>
    <div class="rp-list"></div>
  </div>

  <header>
    <div class="logo-container">
        <h1 class="shack-title" data-text="THE GAME SHACK">THE GAME SHACK</h1>
    </div>
    
    <div class="search-container">
        <input type="text" id="game-search" class="hub-interactive" placeholder="Search games...">
    </div>
    
    <div class="category-filters">
        <button class="cat-btn active-cat hub-interactive" data-filter="all">All Games</button>
        <button class="cat-btn hub-interactive" data-filter="online">Online Multiplayer</button>
        <button class="cat-btn hub-interactive" data-filter="solo">Solo Play</button>
    </div>
  </header>

  <div id="carousel-wrapper">
      <button class="nav-btn hub-interactive" id="prev-page">◄</button>
      
      <main class="game-grid" id="game-grid"></main>

      <button class="nav-btn hub-interactive" id="next-page">►</button>
  </div>
  
  <div id="pagination-dots"></div>

  <div id="os-game-container" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; background: #000;">
      <iframe id="os-game-frame" style="width: 100%; height: 100%; border: none;"></iframe>
  </div>

  <div id="achievements-modal" class="hidden">
    <div class="ach-modal-box">
      <button id="close-ach-btn" class="hub-interactive">&times;</button>
      <h2>TROPHY ROOM</h2>
      <div class="ach-stats">
        <span id="ach-count">0 / 0 Unlocked</span>
      </div>
      <div id="ach-list" class="ach-list">
        </div>
    </div>
  </div>
  
  <script src="system/system_profile.js"></script>
  <script src="system/system_stats.js"></script>
  <script src="system/system_achievements.js"></script>
  <script src="system/system_rewards.js"></script>
  <script src="hub_app.js"></script>

</body>
</html>
