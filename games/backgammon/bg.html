<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <title>Backgammon Pro</title>
  <link rel="stylesheet" href="../../system/system_ui.css"> 
  <link rel="stylesheet" href="bg_style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
      databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
      authDomain: "game-room-26e34.firebaseapp.com",
      projectId: "game-room-26e34",
      storageBucket: "game-room-26e34.firebasestorage.app",
      messagingSenderId: "769541427914",
      appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
    };
    
    const app = initializeApp(firebaseConfig);
    window.db = getDatabase(app);
    window.dbRef = ref; window.dbSet = set; window.dbOnValue = onValue;
    window.dbUpdate = update; window.dbGet = get; window.dbChild = child;
  </script>
</head>
<body>

  <div id="toast-modal" class="hidden modal-overlay">
    <div id="modal-box" class="toast-box">
      <h2 id="modal-title">Result</h2>
      <p id="modal-message">Message goes here.</p>
    </div>
  </div>

  <div id="game-container">
    <div id="bg-board">
      <div class="quadrant top" id="top-left"></div>
      
      <div id="board-bar">
        <div id="bar-white" class="bar-zone"></div>
        <div id="bar-black" class="bar-zone"></div>
      </div>
      
      <div class="quadrant top" id="top-right"></div>
      <div class="quadrant bottom" id="bottom-left"></div>
      <div class="quadrant bottom" id="bottom-right"></div>

      <div class="off-zone-container">
          <div id="off-white" class="off-zone"></div>
          <div id="off-black" class="off-zone"></div>
      </div>
    </div>

    <div id="action-zone">
      <div id="dice-area">
        <div id="die-1" class="die"></div>
        <div id="die-2" class="die"></div>
      </div>

      <div id="betting-ui">
        <div id="os-betting-rack"></div>
        <div id="controls-row" style="display:flex; gap:10px; justify-content:center;">
            <button id="roll-btn" class="action-btn primary-btn">START GAME ($50 Buy-In)</button>
            <button id="undo-btn" class="action-btn danger-btn hidden">UNDO TURN</button>
        </div>
      </div>
      
      <div id="turn-indicator">Waiting to start...</div>
    </div>
  </div>

  <script src="../../system/system_profile.js"></script>
  <script src="../../system/system_audio.js"></script>
  <script src="../../system/system_stats.js"></script>
  <script src="../../system/system_achievements.js"></script>
  <script src="../../system/system_betting.js"></script>
  <script src="../../system/system_lobby.js"></script>
  <script src="../../system/system_chat.js"></script>
  <script src="../../system/system_ui.js"></script>
  <script src="../../system/system_match.js"></script>
  <script src="bg_app.js"></script>
</body>
</html>
