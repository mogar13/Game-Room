<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Pursuit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../system/system_ui.css">
    <link rel="stylesheet" href="trivia_style.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, get, child, remove, onDisconnect } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
            databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
            authDomain: "game-room-26e34.firebaseapp.com",
            projectId: "game-room-26e34",
            storageBucket: "game-room-26e34.firebasestorage.app",
            messagingSenderId: "769541427914",
            appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.db        = database;
        window.dbRef     = ref;
        window.dbSet     = set;
        window.dbOnValue = onValue;
        window.dbUpdate  = update;
        window.dbGet     = get;
        window.dbChild   = child;
        window.dbRemove  = remove;
        window.dbOnDisconnect = onDisconnect;
    </script>
</head>
<body>

<div id="game-container">

    <div id="scoreboard">
        <div id="scores-left" class="scores-side"></div>

        <div id="score-mid">
            <div id="q-counter">—</div>
            <div id="q-counter-label">QUESTION</div>
        </div>

        <div id="scores-right" class="scores-side"></div>
    </div>

    <div id="timer-wrap">
        <div id="timer-bar"></div>
        <div id="timer-val">15</div>
    </div>

    <div id="meta-row">
        <div id="category-badge">—</div>
        <div id="diff-badge" class="diff-easy">EASY</div>
    </div>

    <div id="question-card">
        <div id="question-type-tag">MULTIPLE CHOICE</div>
        <div id="question-text">Loading questions from the internet...</div>
    </div>

    <div id="answer-grid">
        </div>

    <div id="result-banner" class="hidden">
        <span id="result-icon">✓</span>
        <span id="result-text">CORRECT!</span>
        <span id="result-pts">+200</span>
    </div>

    <div id="loading-screen" class="hidden">
        <div id="loading-spinner"></div>
        <div id="loading-text">FETCHING QUESTIONS...</div>
        <div id="loading-sub">Connecting to OpenTDB</div>
    </div>

    <div id="start-screen">
        <div id="start-logo">
            <span class="logo-tri">▲</span>
            <span class="logo-title">TRIVIA<br>PURSUIT</span>
        </div>
        <div id="start-tagline">POWERED BY OPENTDB</div>

        <div id="start-settings">

            <div class="ss-row" id="ss-players-row">
                <div class="ss-label">PLAYERS</div>
                <div class="ss-pills" id="ss-players-pills">
                    <button class="ss-chip" data-group="players" data-val="2">2</button>
                    <button class="ss-chip" data-group="players" data-val="3">3</button>
                    <button class="ss-chip" data-group="players" data-val="4">4</button>
                </div>
            </div>

            <div class="ss-row">
                <div class="ss-label">CATEGORY</div>
                <div class="ss-pills" id="ss-category-pills">
                    </div>
            </div>

            <div class="ss-row">
                <div class="ss-label">QUESTIONS</div>
                <div class="ss-pills" id="ss-qs-pills">
                    <button class="ss-chip" data-group="qs" data-val="5">5</button>
                    <button class="ss-chip" data-group="qs" data-val="10">10</button>
                    <button class="ss-chip" data-group="qs" data-val="15">15</button>
                    <button class="ss-chip" data-group="qs" data-val="20">20</button>
                </div>
            </div>

            <div class="ss-row" id="ss-ai-row">
                <div class="ss-label">AI LEVEL</div>
                <div class="ss-pills" id="ss-ai-pills">
                    <button class="ss-chip" data-group="ai-diff" data-val="easy">EASY</button>
                    <button class="ss-chip" data-group="ai-diff" data-val="medium">MEDIUM</button>
                    <button class="ss-chip" data-group="ai-diff" data-val="hard">HARD</button>
                </div>
            </div>

        </div><button id="start-btn">START GAME</button>
    </div>

    <div id="next-overlay" class="hidden">
        <div id="next-box">
            <div id="next-result-icon">✓</div>
            <div id="next-result-label">CORRECT!</div>
            <div id="next-correct-ans"></div>
            <div id="next-score-delta"></div>
            <button id="next-btn">NEXT QUESTION →</button>
        </div>
    </div>

    <div id="game-over-modal" class="hidden">
        <div class="game-over-box">
            <div id="game-over-emoji">🏆</div>
            <div id="game-over-title">YOU WIN!</div>
            <div id="game-over-msg">Final score: 1800 – 1400</div>
            <div id="game-over-breakdown"></div>
            <button id="btn-play-again">PLAY AGAIN</button>
            <button id="btn-exit-game" onclick="window.location.reload()">EXIT</button>
        </div>
    </div>

</div><script src="../../system/system_profile.js"></script>
<script src="../../system/system_audio.js"></script>
<script src="../../system/system_stats.js"></script>
<script src="../../system/system_achievements.js"></script>
<script src="../../system/system_betting.js"></script>
<script src="../../system/system_lobby.js"></script>
<script src="../../system/system_chat.js"></script>
<script src="../../system/system_ui.js"></script>
<script src="trivia_app.js"></script>
</body>
</html>
