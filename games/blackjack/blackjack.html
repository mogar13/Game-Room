<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <title>Blackjack Pro</title>
  <link rel="stylesheet" href="../../system/system_ui.css"> 
  <link rel="stylesheet" href="bj_style.css">
</head>
<body>

  <div id="table">
    
    <div id="table-stats-container" style="position:absolute; top:15px; left:15px; display:flex; flex-direction:column; gap:10px; z-index:5;">
      <div id="streak-counter" style="background:rgba(0,0,0,0.6); padding:5px 10px; border-radius:10px; color:#f1c40f; font-weight:bold; border: 1px solid #f1c40f; font-size: 0.9rem;">
        🔥 Streak: <span id="streak-val">0</span>
      </div>
    </div>

    <div class="dealer-tray">
      <div class="chip-rows"></div>
    </div>
    <div class="dealer-shoe">
      <div class="shoe-glass"></div>
      <div class="shoe-opening"></div>
    </div>

    <div class="card-area" id="dealer-area">
      <div id="dealer-score" class="score-bubble hidden">0</div>
      <div id="dealer-cards" class="card-container"></div>
      <div id="dealer-bet-chips"></div>
    </div>

    <div class="table-text">
      <h1>BLACKJACK PAYS 3 TO 2</h1>
      <h2 id="dealer-rule-text">Dealer must draw to 16 and stand on 17</h2>
      <h3>INSURANCE PAYS 2 TO 1</h3>
    </div>

    <div id="players-arc">
      
      <div class="box-slot hidden" id="box-slot-2">
        <div id="player-name-2" class="nameplate"></div>
        <div id="table-pot-display-2" class="pot-display hidden"></div>
        <div id="table-bet-chips-2" class="bet-chips"></div>
        <div id="player-score-2" class="score-bubble hidden">0</div>
        <div id="player-cards-2" class="card-container"></div>
      </div>

      <div class="box-slot hidden" id="box-slot-0">
        <div id="player-name-0" class="nameplate"></div>
        <div id="table-pot-display-0" class="pot-display hidden"></div>
        <div id="table-bet-chips-0" class="bet-chips"></div>
        <div id="player-score-0" class="score-bubble hidden">0</div>
        <div id="player-cards-0" class="card-container"></div>
      </div>

      <div class="box-slot hidden" id="box-slot-1">
        <div id="player-name-1" class="nameplate"></div>
        <div id="table-pot-display-1" class="pot-display hidden"></div>
        <div id="table-bet-chips-1" class="bet-chips"></div>
        <div id="player-score-1" class="score-bubble hidden">0</div>
        <div id="player-cards-1" class="card-container"></div>
      </div>

      <div class="box-slot hidden" id="box-slot-3">
        <div id="player-name-3" class="nameplate"></div>
        <div id="table-pot-display-3" class="pot-display hidden"></div>
        <div id="table-bet-chips-3" class="bet-chips"></div>
        <div id="player-score-3" class="score-bubble hidden">0</div>
        <div id="player-cards-3" class="card-container"></div>
      </div>

    </div>

  </div>

  <div id="action-zone">
    <div id="betting-controls">
      <div id="os-betting-rack"></div>
      <button id="deal-btn" class="action-btn primary-btn" disabled>DEAL</button>
    </div>

    <div id="playing-controls" class="hidden">
      <div class="button-grid">
        <button id="split-btn" class="action-btn split-btn" disabled>Split</button>
        <button id="hit-btn" class="action-btn hit-btn">Hit</button>
        <button id="double-btn" class="action-btn double-btn">Double Down</button>
        <button id="stand-btn" class="action-btn stand-btn">Stand</button>
      </div>
      <button id="insurance-btn" class="action-btn insurance-btn hidden">Buy Insurance</button>
    </div>
  </div>

  <div id="toast-modal" class="hidden modal-overlay">
    <div id="modal-box" class="toast-box">
      <h2 id="modal-title">Result</h2>
      <p id="modal-message">Message goes here.</p>
    </div>
  </div>

  <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
      import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
      
      const firebaseConfig = {
        apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
        databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
        authDomain: "game-room-26e34.firebaseapp.com",
        projectId: "game-room-26e34",
        storageBucket: "game-room-26e34.firebasestorage.app",
        messagingSenderId: "769541427914",
        appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
      };
      
      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);
      
      window.db = database;
      window.dbRef = ref;
      window.dbSet = set;
      window.dbOnValue = onValue;
      window.dbUpdate = update;
      window.dbGet = get;
      window.dbChild = child;
  </script>

  <script src="../../system/system_profile.js"></script>
  <script src="../../system/system_audio.js"></script>
  <script src="../../system/system_stats.js"></script>
  <script src="../../system/system_achievements.js"></script>
  <script src="../../system/system_store.js"></script>
  <script src="../../system/system_betting.js"></script>
  <script src="../../system/system_lobby.js"></script>
  <script src="../../system/system_chat.js"></script>
  <script src="../../system/system_ui.js"></script>
  <script src="../../system/system_match.js"></script>
  <script src="bj_app.js"></script>
</body>
</html>
