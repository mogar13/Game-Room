<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <title>Old Maid</title>
  
  <link rel="stylesheet" href="../../system/system_ui.css"> 
  <link rel="stylesheet" href="old_maid_style.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
      databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
      authDomain: "game-room-26e34.firebaseapp.com",
      projectId: "game-room-26e34",
      storageBucket: "game-room-26e34.firebasestorage.app",
      messagingSenderId: "769541427914",
      appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
    };
    
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    
    window.db = database;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbUpdate = update;
    window.dbGet = get;
    window.dbChild = child;
  </script>
</head>
<body>

  <div id="game-container">
    <div id="card-table">
      
      <div id="opponent-area" class="player-seat hidden">
        <div class="player-info">
          <span id="opp-name">AI 2</span>
        </div>
        <div class="card-container" id="opp-cards"></div>
      </div>

      <div id="left-area" class="player-seat side-seat hidden">
        <div class="player-info">
          <span id="left-name">AI 3</span>
        </div>
        <div class="card-container" id="left-cards"></div>
      </div>

      <div id="center-area">
        <div id="game-status-text">Waiting to start...</div>
        <div class="table-middle-row">
            <div id="discard-pile" class="card-container"></div>
        </div>
      </div>

      <div id="right-area" class="player-seat side-seat hidden">
        <div class="player-info">
          <span id="right-name">AI 4</span>
        </div>
        <div class="card-container" id="right-cards"></div>
      </div>

      <div id="player-area" class="player-seat">
        <div class="card-container" id="player-cards"></div>
        <div class="player-info">
          <span id="player-name">You</span>
        </div>
      </div>

    </div>

    <div id="action-zone">
      <div id="pre-game-controls" style="display:flex; gap:10px; justify-content:center; max-width: 500px; margin: 0 auto;">
        <button id="start-game-btn" class="action-btn primary-btn" style="margin: 0; width: 100%;">START GAME</button>
      </div>
    </div>
  </div>

  <div id="toast-modal" class="hidden modal-overlay">
    <div id="modal-box" class="toast-box">
      <h2 id="modal-title">Result</h2>
      <p id="modal-message">Message goes here.</p>
    </div>
  </div>

  <script src="../../system/system_profile.js"></script>
  <script src="../../system/system_audio.js"></script>
  <script src="../../system/system_stats.js"></script>
  <script src="../../system/system_achievements.js"></script>
  <script src="../../system/system_lobby.js"></script>
  <script src="../../system/system_chat.js"></script>
  <script src="../../system/system_ui.js"></script> 
  
  <script src="../../system/system_match.js"></script>
  
  <script src="old_maid_app.js"></script>
</body>
</html>
