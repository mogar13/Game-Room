<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0410">
  <title>Bowman</title>
  <link rel="stylesheet" href="../../system/system_ui.css">
  <link rel="stylesheet" href="bowman_style.css">
</head>
<body>

  <div id="game-outer">

    <div id="hp-row">
      <div class="hp-block left">
        <div class="hp-name" id="hp-name-0">Player 1</div>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="hp-fill-0" style="width:100%; background:#2ecc71;"></div>
        </div>
        <div class="hp-value" id="hp-text-0">100 HP</div>
        <div class="shield-icon hidden" id="shield-0">🛡️</div>
      </div>

      <div id="wind-display">
        <div id="wind-label">💨 WIND</div>
        <div id="wind-value">—</div>
      </div>

      <div class="hp-block right">
        <div class="shield-icon hidden" id="shield-1">🛡️</div>
        <div class="hp-value" id="hp-text-1">100 HP</div>
        <div class="hp-bar-track">
          <div class="hp-bar-fill" id="hp-fill-1" style="width:100%; background:#2ecc71;"></div>
        </div>
        <div class="hp-name" id="hp-name-1">Opponent</div>
      </div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
    </div>

    <div id="action-zone">
      <div id="pre-game-btns">
        <button id="start-btn" class="action-btn primary-btn">⚔️ START BATTLE</button>
      </div>

      <div id="in-game-controls" class="hidden">
        <div id="arrow-selector">
          <button class="arrow-type-btn active" data-type="normal" title="Normal Arrow">
            🏹 <span>Normal</span>
            <span class="arrow-count" id="count-normal">∞</span>
          </button>
          <button class="arrow-type-btn" data-type="explosive" title="Explosive Arrow">
            💣 <span>Explosive</span>
            <span class="arrow-count" id="count-explosive">2</span>
          </button>
          <button class="arrow-type-btn" data-type="bouncy" title="Bouncy Arrow">
            ↩️ <span>Bouncy</span>
            <span class="arrow-count" id="count-bouncy">2</span>
          </button>
        </div>
        <div id="turn-label">YOUR TURN</div>
      </div>
    </div>

  </div>

  <div id="result-modal" class="hidden modal-overlay">
    <div class="modal-box">
      <h2 id="modal-title">Result</h2>
      <p id="modal-msg">...</p>
      <button id="play-again-btn" class="action-btn primary-btn" style="margin-top:16px;">PLAY AGAIN</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
      databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
      authDomain: "game-room-26e34.firebaseapp.com",
      projectId: "game-room-26e34",
      storageBucket: "game-room-26e34.firebasestorage.app",
      messagingSenderId: "769541427914",
      appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
    };
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    window.db = database;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbUpdate = update;
    window.dbGet = get;
    window.dbChild = child;
  </script>

  <script src="../../system/system_profile.js"></script>
  <script src="../../system/system_audio.js"></script>
  <script src="../../system/system_stats.js"></script>
  <script src="../../system/system_achievements.js"></script>
  <script src="../../system/system_lobby.js"></script>
  <script src="../../system/system_chat.js"></script>
  <script src="../../system/system_ui.js"></script>
  <script src="../../system/system_match.js"></script>
  <script src="bowman_app.js"></script>

</body>
</html>
