<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
    <title>Chess Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../system/system_ui.css">
    <link rel="stylesheet" href="chess_style.css">
</head>
<body>

<div id="game-container">

    <div class="player-bar" id="top-bar">
        <div class="pb-left">
            <span class="p-name" id="opp-name">AI</span>
            <span class="move-count" id="moves-black">0 moves</span>
        </div>
        <div class="pb-mid">
            <span class="captured" id="cap-black" style="display:flex; flex-wrap:wrap; align-items:center;"></span>
            <span class="adv" id="adv-black"></span>
        </div>
        <div class="pb-right">
            <div class="timer-box" id="timer-box-black">
                <span class="timer-val" id="timer-black">0:00</span>
            </div>
        </div>
    </div>

    <div id="board-wrap">
        <div id="rank-col">
            <span class="rlbl">8</span><span class="rlbl">7</span><span class="rlbl">6</span>
            <span class="rlbl">5</span><span class="rlbl">4</span><span class="rlbl">3</span>
            <span class="rlbl">2</span><span class="rlbl">1</span>
        </div>
        <div id="board-stack">
            <div id="chess-board"></div>
            <div id="file-row">
                <span class="flbl">a</span><span class="flbl">b</span><span class="flbl">c</span>
                <span class="flbl">d</span><span class="flbl">e</span><span class="flbl">f</span>
                <span class="flbl">g</span><span class="flbl">h</span>
            </div>
        </div>
    </div>

    <div class="player-bar" id="bot-bar">
        <div class="pb-left">
            <span class="p-name" id="player-name">YOU</span>
            <span class="move-count" id="moves-white">0 moves</span>
        </div>
        <div class="pb-mid">
            <span class="captured" id="cap-white" style="display:flex; flex-wrap:wrap; align-items:center;"></span>
            <span class="adv" id="adv-white"></span>
        </div>
        <div class="pb-right">
            <div class="timer-box active" id="timer-box-white">
                <span class="timer-val" id="timer-white">0:00</span>
            </div>
        </div>
    </div>

    <div id="status-row">
        <div id="turn-pip"></div>
        <div id="status-text">YOUR TURN</div>
    </div>
    <div id="ctrl-row">
        <button id="btn-new-game">⟳ NEW GAME</button>
    </div>

    <div id="history-panel">
        <div id="history-header">MOVE HISTORY</div>
        <div id="history-list"></div>
    </div>

</div>

<div id="diff-toast" class="hidden">
    <div id="diff-toast-text"></div>
</div>

<div id="check-banner" class="hidden">
    <span id="check-banner-text">⚠ CHECK!</span>
</div>

<div id="promo-overlay" class="hidden">
    <div id="promo-box">
        <div class="overlay-title">PROMOTE PAWN</div>
        <div id="promo-choices"></div>
    </div>
</div>

<div id="game-over-modal" class="hidden">
    <div class="game-over-box">
        <div id="result-emoji" style="font-size:3rem; margin-bottom:8px; line-height:1;">🏆</div>
        <div id="game-over-title">YOU WIN!</div>
        <div id="game-over-msg"></div>
        <div id="result-stats"></div>
        <button id="btn-play-again">PLAY AGAIN</button>
        <button id="btn-exit-game" onclick="window.location.reload()">EXIT</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, update, get, child } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAaQ95UV63kEN4DD-HT35G9VNJVnVw9XFM",
      databaseURL: "https://game-room-26e34-default-rtdb.firebaseio.com",
      authDomain: "game-room-26e34.firebaseapp.com",
      projectId: "game-room-26e34",
      storageBucket: "game-room-26e34.firebasestorage.app",
      messagingSenderId: "769541427914",
      appId: "1:769541427914:web:b7e7bb87c160a5b8cfda33"
    };
    
    const app = initializeApp(firebaseConfig);
    window.db = getDatabase(app);
    window.dbRef = ref; window.dbSet = set; window.dbOnValue = onValue;
    window.dbUpdate = update; window.dbGet = get; window.dbChild = child;
</script>

<script src="../../system/player_name.js"></script>
<script src="../../system/system_ui.js"></script>
<script src="chess_app.js"></script>
</body>
</html>
